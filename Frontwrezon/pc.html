<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/jpeg" href="favicon.jpeg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0,interactive-widget=overlays-content">
    <title>Wrezon AI</title>
    <link rel="stylesheet" href="pc.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.css" /> <!-- this a js katex math css libratu to render code-->

</head>
<body>
   

    <div class="micInput" id="micInput"></div>
    <div class="main-container" >
        
        <button class="PD" id="tutorial-FAB">
            <p class="tutorial-insider">▷</p>
            
        </button>
        <div class="Display-data" id="displayData">
            <iframe class="HD" id="playtutorial"></iframe>
        </div>

    
        <div class="frame" id="Frame">
            <div class="files_display" id="files_display"></div>
            <div class="input-bar-holder" id="input-holder">
                <div class="search-icon" id="search-lone">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                </div>

                <textarea class="textarea" id="textArea" placeholder="ask wrezon..."></textarea>
    
                <div class="search-icon" id="mic">
                    <div class="mic-holder">
                        <svg  id="bulb" viewBox="0 0 24 24" width="40" height="40" fill="currentColor">
                            <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
                            <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
                        </svg>
                
                    </div>
                
                </div>
                <button class="HD" id="sendBt">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="22" y1="2" x2="11" y2="13"></line>
                        <polygon points="22 5 15 22 11 13 2 9 22 2"></polygon>
                    </svg>
                </button>
                
                
                


            </div>
            <div class="search-icon" id="addButton">
                
                <p>+</p>
                <input type="file" id="files" hidden>
            </div>
            
        </div>

    </div>
    <div class="tutorial-bar" id="tutorialBar">
        <div class="PD" id="playTutorial"></div>
    </div>

    <button class="FAB" id="btn">
        
        <span class="span"></span>
        <span class="span"></span>
        <span class="span1"></span>

    </button>


    <div  id="menu" class="PD">
        <p>settings unavailable !</p>
        <button class="adminBtn" id="ADbutton" >AD</button>
    </div>
    
    <div class="logo-container" id="logo-container">
        
        <div class="logo" id="mainLogo">
            <div class="b-logo" id="b-logo"></div>
            <div class="r-logo" id="r-logo"></div>
            <div class="d-logo" id="d-logo"></div>
            <div class="b-logo" id="b1-logo"></div>
        </div>
        
        <p class="logo-text" id="appName"></p>
    </div>

    <div class="userWellcome" id="userWellcome">
        <!--<p>what's on your mind,⛈️</p>-->
    </div>
    <div class="PD" id="mark"></div>
    



   
    



    <script type="module" src="pc.js"></script>
    
</body>
</html>
