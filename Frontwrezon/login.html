<!DOCTYPE html>
<html>
    <head lang="eng">


        <meta charset="UTF-8">
        
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>twend.com</title>
        <link rel="stylesheet" href="login.css"
    </head>
    <body>
        <div class="HD" id="acountForm">
            
            <button class="backtologin" id="backHome">

                back
            
            </button>
            <button class="finishButton" id="finishButton"> Done</button>
            <div class="logo">
                <div class="diagonal_lend"></div>
                <div class="top_right_lend"></div>
                <div class="down_left_lend"></div>
                <div class="diagonal_lend"></div>
            </div>
            <div class="acountPage" id="acountPage">
                <div class="acount_toptext_holder" id="toptext">
                    <p>Create your Wrezon Acount</p>
                </div>
               

                
                <p class="acountplaceholder">Name</p>
                <input class="placeText" type="text" placeholder="Enter you full name" id="name">
                <p class="acountplaceholder">Date of Birth</p>
                <input class="placeText" type="date" id="DOB">
                <p class="acountplaceholder">Phone number</p>
                <input class="placeText" type="number" id="phoneNumber" >
                <p class="acountplaceholder">Email</p>
                <input class="placeText" type="email" id="email">
                <p class="acountplaceholder">Gender</p>
                <div class="placeText" id="gender" >
                    <input type="radio" name="gender" value="male" id="maleGander">male
                    <input type="radio" name="gender" value="female" id="femaleGander">female
                </div>
                <p class="acountplaceholder">Create your password</p>
                <input class="placeText" type="password" id="newPassword">
                <p class="acountplaceholder" id="errorMessage">Confirm password</p>
                <input class="placeText" type="password" id="confirmedPassword">



                
            </div>

        </div>

        <div class="mainbox">
            <div class="input-holder">
                <div class="log1">
                    <div class="log01">
                        <p>👤</p>
                    </div>
                    <input class="log001" type="text" placeholder=":Enter your names e.g wakitopi-kitopi" id="name">
                </div>
                <div class="log1">
                    <div class="log01">
                        <p>🔒</p>
                    </div>
                    <input class="log001" type="password" placeholder=":Enter your password" id="password">
                </div>
                <div class="log1">
                    <div class="log01">
                        <p>🌍</p>
                    </div>
                    <input class="log001" type="text" placeholder="country" id="country">
                </div>
                <div class="log1">
                    <div class="log01">
                        <p>📞</p>
                    </div>
                    <input class="log001" type="text" placeholder="phone#" id="phone">
                </div>
                <div class="submitbox">
                    <a class="submit" id="submit">
                        login
                    
                    </a>
                    <button class="createAcount" id="createAcount">
                        Creat Acount
                    
                    </button>

                </div>
                
            </div>
            <div class="other-acounts">
                <p>login with other acount</p>
            </div>
            <div class="acount-container">
                <a class="acounts" href="https://myaccount.google.com/">
                    <img class="acount-img" src="google.png" alt="company image">
                </a>
                <a class="acounts" href="https://myaccount.google.com/">
                    <img class="acount-img" src="x.png" alt="X image">
                </a>

            </div>
           
        </div>
        
    <script src="login.js"></script>
           
    </body>
</html>
