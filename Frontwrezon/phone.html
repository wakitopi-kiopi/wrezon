<!DOCTYPE html>

<head>
    <meta charset="UTF-8">

    <div class="main-container">
        
        <div class="top-blur"></div>
        <div class="PD" id="mark"></div>
        <button class="PD" id="tutorial-FAB">
            <p class="tutorial-insider">▷</p>

        </button>
        <div class="Display-data" id="displayData">
            <iframe class="HD" id="playtutorial"></iframe>
        </div>


        <div class="frame" id="Frame">
            <div class="input-bar-holder" id="input-holder">
                <div class="search-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"

                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                </div>


                <textarea class="textarea" id="textArea" placeholder="ask wrezon..."></textarea>


                <button class="HD" id="sendBt">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="22" y1="2" x2="11" y2="13"></line>
                        <polygon points="22 5 15 22 11 13 2 9 22 2"></polygon>
                    </svg>
                </button>
                <div class="search-icon" id="mic">
                    <div class="mic-holder">
                        <div class="mic-bulb"></div>
                        <div class="mic-pan"></div>
                        <span class="mic-leg"></span>
                    </div>

                </div>
                <div class="search-icon" id="voiceChat">
                    <div class="voice-holder">
                       
                        <span class="voice-bars"></span>
                        <span class="voice-bars1"></span>
                        <span class="voice-bars2"></span>
                        <span class="voice-bars3"></span>
                        <span class="voice-bars4"></span>
                        <span class="voice-bars5"></span>
                        <span class="voice-bars3"></span>
                        <span class="voice-bars4"></span>
                        <span class="voice-bars3"></span>
                        <span class="voice-bars2"></span>
                        <span class="voice-bars1"></span>
                        
                        <span class="voice-bars"></span>
                    </div>


                </div>


            </div>
            <div class="search-icon" id="addButton">
                <p>+</p>
                <input type="file" id="files" hidden>
            </div>
        </div>

    </div>
    <div class="tutorial-bar" id="tutorialBar">
       <div class="PD" id="playTutorial"></div>
    </div>

    <button class="FAB" id="btn">

       
        <span class="span"></span>
        <span class="span1"></span>

    </button>


    <div id="menu" class="PD">

            </div>

        </div>
        <div class="setting_holder"></div>
        <div class="setting_holder"></div>
        <div class="setting_holder"></div>
        <div class="setting_holder"></div>
        <div class="setting_holder"></div>
        <p>settings unavaillable</p>
        <button class="adminBtn" id="ADbutton">AD</button>
    </div>



    <div class="logo-container" id="logo-container">
        <div class="logo1" id="logo1"></div>
        <div class="logo" id="mainLogo">
            <div class="b-logo" id="b-logo"></div>
            <div class="r-logo" id="r-logo"></div>
            <div class="d-logo" id="d-logo"></div>
            <div class="b-logo" id="b1-logo"></div>
        </div>
        <div class="logo1" id="logo2"></div>
        <p class="logo-text" id="appName"></p>
    </div>

    <div class="userWellcome" id="userWellcome">

    </div>
